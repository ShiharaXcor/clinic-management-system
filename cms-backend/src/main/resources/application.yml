server:
  port: 8080

spring:
  application:
    name: cms-backend
  datasource:
    url: jdbc:mysql://localhost:3307/cms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cms_user
    password: cms_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate must not auto-generate it
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: this-is-a-much-longer-secret-key-for-jwt-signing-change-in-production-1234567890
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
logging:
  level:
    com.clinic.cms_backend: DEBUG
    org.springframework.security: DEBUG